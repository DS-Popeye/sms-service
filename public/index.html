<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rabiulawalshuvo Forms</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #eef4f8;
        color: #10202f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          linear-gradient(135deg, rgba(14, 116, 144, 0.14), transparent 38%),
          linear-gradient(315deg, rgba(15, 23, 42, 0.10), transparent 42%),
          #f6f9fc;
      }

      main {
        width: min(100%, 620px);
      }

      .form-card {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(203, 213, 225, 0.9);
        border-radius: 8px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
        overflow: hidden;
      }

      .brand-bar {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 24px 28px;
        border-bottom: 1px solid #e2e8f0;
        background: linear-gradient(135deg, #ffffff, #f8fafc);
      }

      .logo-badge {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 48px;
        height: 48px;
        border-radius: 8px;
        background: #0f172a;
        color: #ffffff;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand-name {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
        color: #0f172a;
      }

      .brand-line {
        margin: 4px 0 0;
        color: #64748b;
        font-size: 14px;
      }

      .content {
        padding: 32px 28px 28px;
      }

      h1 {
        margin: 0;
        color: #0f172a;
        font-size: 34px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .subheading {
        margin: 12px 0 26px;
        color: #475569;
        font-size: 16px;
        line-height: 1.65;
      }

      label {
        display: block;
        margin: 16px 0 7px;
        color: #1e293b;
        font-size: 14px;
        font-weight: 750;
      }

      input,
      textarea,
      button {
        width: 100%;
        font: inherit;
      }

      input,
      textarea {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 13px 14px;
        background: #ffffff;
        color: #0f172a;
        outline: none;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      input:focus,
      textarea:focus {
        border-color: #0e7490;
        box-shadow: 0 0 0 4px rgba(14, 116, 144, 0.14);
      }

      textarea {
        min-height: 142px;
        resize: vertical;
      }

      button {
        margin-top: 20px;
        border: 0;
        border-radius: 8px;
        padding: 14px 16px;
        background: #0f172a;
        color: #ffffff;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.18);
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          opacity 160ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 18px 38px rgba(15, 23, 42, 0.22);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.68;
      }

      .honeypot {
        position: absolute;
        left: -10000px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      #formStatus {
        margin-top: 16px;
        min-height: 24px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.5;
      }

      #formStatus.success,
      #formStatus.error {
        padding: 12px 14px;
      }

      #formStatus.success {
        background: #ecfdf5;
        border: 1px solid #bbf7d0;
        color: #166534;
      }

      #formStatus.error {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
      }

      #formStatus a {
        color: inherit;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      @media (max-width: 560px) {
        body {
          padding: 18px 12px;
        }

        .brand-bar,
        .content {
          padding-left: 20px;
          padding-right: 20px;
        }

        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="form-card" aria-labelledby="formTitle">
        <div class="brand-bar">
          <div class="logo-badge" aria-hidden="true">RF</div>
          <div>
            <p class="brand-name">Rabiulawalshuvo Forms</p>
            <p class="brand-line">Secure branded form delivery</p>
          </div>
        </div>

        <div class="content">
          <h1 id="formTitle">Premium Contact Form</h1>
          <p class="subheading">
            Send your inquiry securely through our branded form system.
          </p>

          <form id="contactForm">
            <input type="hidden" name="site_id" value="rabiulawalshuvo_forms">
            <input type="hidden" name="page_url" value="http://localhost:3000">

            <div class="honeypot" aria-hidden="true">
              <label for="website">Website</label>
              <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>

            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>

            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel">

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send Inquiry</button>
            <div id="formStatus" role="status" aria-live="polite"></div>
          </form>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#contactForm");
      const statusEl = document.querySelector("#formStatus");
      const button = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        statusEl.textContent = "";
        statusEl.className = "";
        button.disabled = true;
        button.textContent = "Sending...";

        try {
          const formData = new FormData(form);
          const payload = new URLSearchParams(formData);
          const response = await fetch("/api/contact", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: payload,
          });

          const result = await response.json();
          statusEl.textContent = result.success
            ? "Your inquiry has been sent successfully."
            : result.message || "We could not send your inquiry. Please try again.";
          statusEl.className = result.success ? "success" : "error";

          if (result.previewUrl) {
            const previewLink = document.createElement("a");
            previewLink.href = result.previewUrl;
            previewLink.target = "_blank";
            previewLink.rel = "noreferrer";
            previewLink.textContent = "Open Ethereal preview";
            statusEl.append(document.createElement("br"), previewLink);
          }

          if (result.success) {
            form.reset();
          }
        } catch (error) {
          statusEl.textContent = "We could not send your inquiry. Please try again.";
          statusEl.className = "error";
        } finally {
          button.disabled = false;
          button.textContent = "Send Inquiry";
        }
      });
    </script>
  </body>
</html>
